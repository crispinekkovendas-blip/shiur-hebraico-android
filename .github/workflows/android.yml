name: Build APK

# Every push: a debug APK signed with the shared key, attached to the run as "shiur-hebraico-<run>"
# and published as the release "latest" (a fixed download link).
on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/shared.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/shared.jks" >> "$GITHUB_ENV"
          else
            echo "no signing key secret: the APK is signed with a throwaway debug key"
          fi

      - name: APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "shiur-hebraico-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "shiur-hebraico-debug-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shiur-hebraico-${{ github.run_number }}
          path: shiur-hebraico-*${{ github.run_number }}.apk

      - name: Publish as the release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "shiur-hebraico-${{ github.run_number }}.apk" shiur-hebraico.apk
          cp "shiur-hebraico-debug-${{ github.run_number }}.apk" shiur-hebraico-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest shiur-hebraico.apk shiur-hebraico-debug.apk --title "Shiur Hebraico — build ${{ github.run_number }}" --notes "Instale o APK no Android (permita apps de fontes desconhecidas)." --latest
